[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-youraitools"
version = "0.1.0"
description = "CrewAI tools for YourAITools pay-per-call x402 APIs: PayGuard (OFAC screen), TokenVerdict (token safety), SmartPerps (Hyperliquid smart money), ToolPick (paid API finder), WebRead (page to Markdown), InjectScan (prompt injection)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["crewai>=0.80", "httpx>=0.27", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://api.youraitools.co/docs/which-api"
Source = "https://agentgate-source.pages.dev/"
